<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="scoresboard">
            <div id="home-team" class="team-scores">
                <h2 class="team-name">Home</h2>
                <h1 id="home-score-num">0</h1>
                <div class="score-changes">
                    <button title="+1" class="score-btn" onclick="HomePlusOne()">+1</button>
                    <button title="+2" class="score-btn" onclick="HomePlusTwo()">+2</button>
                    <button title="+3" class="score-btn" onclick="HomePlusThree()">+3</button>
                </div>
            </div>
            <div id="guest-team" class="team-scores">
                <h2 class="team-name">Guest</h2>
                <h1 id="guest-score-num">0</h1>
                <div class="score-changes">
                    <button title="+1" class="score-btn" onclick="GuestPlusOne()">+1</button>
                    <button title="+2" class="score-btn" onclick="GuestPlusTwo()">+2</button>
                    <button title="+3" class="score-btn" onclick="GuestPlusThree()">+3</button>
                </div>
            </div>
        </div>
        <button title="new-game" id="new-game-btn" onclick="NewGame()">New Game</button>
        <p id="the-winner"></p>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
